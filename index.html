<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Trader X Academy | Platform Trading Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background-color: #050505;
            overflow-x: hidden;
            padding-bottom: 70px;
        }

        /* Animated Background Grid - Igloo style */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating Orbs */
        .orb-bg {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 { width: 600px; height: 600px; background: #3a1b6b; top: -200px; left: -200px; animation: floatOrb 20s infinite alternate; }
        .orb-2 { width: 500px; height: 500px; background: #1b3a6b; bottom: -200px; right: -100px; animation: floatOrb 25s infinite alternate-reverse; }
        .orb-3 { width: 400px; height: 400px; background: #6b1b3a; top: 50%; left: 70%; animation: floatOrb 18s infinite alternate; }
        
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -50px) scale(1.2); }
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* Glass Button Effect */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            color: #000000;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transition: 0.5s;
        }

        .btn:hover:before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #ffffff;
            color: #000000;
        }

        /* Header - Glassmorphism */
        header {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(20px);
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .logo i {
            color: #ffffff;
            margin-right: 10px;
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 30px;
            position: relative;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .nav-links a:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background: #ffffff;
            left: 0;
            bottom: -5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-links a:hover:after {
            width: 100%;
        }

        .mobile-menu {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: #ffffff;
        }

        /* Hero Section - Enhanced */
        .hero {
            padding: 180px 0 100px;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 64px;
            margin-bottom: 20px;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff, #aaaaaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.7);
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        /* Stats - Glass Card */
        .trading-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 80px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-item {
            text-align: center;
            position: relative;
            padding: 0 30px;
        }

        .stat-item:not(:last-child):after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
        }

        .stat-value {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .stat-label {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* About Section - Dark themed */
        .about {
            padding: 120px 0;
            background: rgba(10, 10, 10, 0.5);
            position: relative;
        }

        .section-title h2 {
            font-size: 36px;
            position: relative;
            display: inline-block;
            padding-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .section-title h2:after {
            content: '';
            position: absolute;
            width: 80px;
            height: 3px;
            background: #ffffff;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .about-content {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .about-text {
            flex: 1;
        }

        .about-text h3 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .about-text p {
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        .about-features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: #ffffff;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .about-image {
            flex: 1;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .about-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Services Section - Glass Cards */
        .services {
            padding: 120px 0;
            background: transparent;
            position: relative;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .service-card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffffff, transparent);
            transform: translateX(-100%);
            transition: all 0.5s ease;
        }

        .service-card:hover:before {
            transform: translateX(100%);
        }

        .service-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .service-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #ffffff;
            font-size: 32px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .service-card:hover .service-icon {
            background: #ffffff;
            color: #000000;
            transform: rotateY(180deg);
        }

        .service-card h3 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .service-card p {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Tools Section */
        .tools {
            padding: 120px 0;
            background: rgba(10, 10, 10, 0.5);
        }

        .tools-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .tool-item {
            flex: 1;
            min-width: 250px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tool-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .tool-icon {
            font-size: 40px;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .tool-item h3 {
            color: #ffffff;
            margin-bottom: 10px;
        }

        .tool-item p {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Platform Preview - Enhanced */
        .platform-preview {
            padding: 100px 0;
            background: transparent;
            text-align: center;
        }

        .platform-container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .platform-header {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .platform-window-controls {
            display: flex;
            gap: 10px;
        }

        .control {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .control.close { background: #ff5f57; }
        .control.minimize { background: #ffbd2e; }
        .control.maximize { background: #28ca42; }

        .platform-content {
            padding: 0;
            height: 400px;
            background: #0a0a0a;
            position: relative;
            overflow: hidden;
        }

        .chart-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #0a0a0a 21px, transparent 1%) center,
                        linear-gradient(#0a0a0a 21px, transparent 1%) center,
                        #111111;
            background-size: 22px 22px;
            position: relative;
        }

        .chart-line {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70%;
            background: linear-gradient(to top, rgba(0, 255, 150, 0.3) 0%, transparent 70%);
            clip-path: polygon(0% 100%, 5% 80%, 10% 85%, 15% 70%, 20% 75%, 25% 60%, 30% 65%, 35% 50%, 40% 55%, 45% 40%, 50% 45%, 55% 30%, 60% 35%, 65% 20%, 70% 25%, 75% 10%, 80% 15%, 85% 5%, 90% 10%, 95% 0%, 100% 5%);
            animation: chartPulse 3s infinite alternate;
        }

        @keyframes chartPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .price-indicator {
            position: absolute;
            right: 20px;
            top: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 18px;
            border-radius: 40px;
            border-left: 3px solid #00ff96;
            font-family: 'Orbitron', sans-serif;
            color: #00ff96;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        /* Testimonials */
        .testimonials {
            padding: 120px 0;
            background: rgba(10, 10, 10, 0.5);
        }

        .testimonial-slider {
            display: flex;
            gap: 30px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 20px 10px;
            scroll-behavior: smooth;
        }

        .testimonial-item {
            flex: 0 0 85%;
            scroll-snap-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .client-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 3px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .client-img i {
            font-size: 40px;
            line-height: 80px;
        }

        .testimonial-text {
            font-style: italic;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .testimonial-text:before, .testimonial-text:after {
            content: '"';
            font-size: 50px;
            color: rgba(255, 255, 255, 0.2);
            position: absolute;
        }

        .testimonial-text:before {
            top: -20px;
            left: -10px;
        }

        .testimonial-text:after {
            bottom: -40px;
            right: -10px;
        }

        .client-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .client-title {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        /* Contact Section */
        .contact {
            padding: 120px 0;
            background: transparent;
        }

        .contact-container {
            display: flex;
            gap: 50px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .contact-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            margin-right: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .contact-details h3 {
            f
